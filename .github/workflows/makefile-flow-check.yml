name: Makefile Flow Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  makefile-flow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install open-source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog verilator yosys

      - name: Check help and configuration
        run: |
          make help
          make print-config

      - name: Run selected Icarus simulation through root dispatcher
        run: |
          make sim SIM=iverilog TEST=byte_addressing

      - name: Run complete regression through root dispatcher
        run: |
          make regression SIM=iverilog

      - name: Validate VCS and FSDB command expansion
        run: |
          make -C sim vcs-dry-run

      - name: Run synthesis entry point
        run: |
          make synthesis
