name: Single Length Minimal Smoke

on:
  push:
    branches:
      - agent/single-length

permissions:
  contents: write

jobs:
  minimize-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep smoke focused on AXI interface attributes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tb/tb_axi_buf_dma.sv')
          text = path.read_text()
          start = text.index('    buffer_write(7\'d0, 32\'h11223344);')
          end = text.index('    $display("AXI Buffer DMA ID/PROT smoke test PASSED");')
          body = '''    buffer_write(7'd0, 32'h11223344);\n    buffer_write(7'd1, 32'h55667788);\n\n    // Default SINGLE_LENGTH=1: one 8-byte write request with AWLEN=0.\n    start_dma(32'h0000_0100, 9'd7, 1'b1);\n    if (dma_error)\n      $fatal(1, "Unexpected DMA write error code %0d", dma_error_code);\n\n    mem.mem[16'h200] = 8'hA5;\n\n    // One-byte read request also requires ARLEN=0.\n    start_dma(32'h0000_0200, 9'd0, 1'b0);\n    if (dma_error)\n      $fatal(1, "Unexpected DMA read error code %0d", dma_error_code);\n\n'''
          path.write_text(text[:start] + body + text[end:])
          PY
          sed -n '140,180p' tb/tb_axi_buf_dma.sv
      - name: Commit minimal smoke
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tb/tb_axi_buf_dma.sv
          git commit -m "test: focus smoke on AXI interface attributes"
          git push origin HEAD:agent/single-length
