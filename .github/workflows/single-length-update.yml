name: Single Length Update

on:
  push:
    branches:
      - agent/single-length

permissions:
  contents: write

jobs:
  fix-single-length-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix smoke-test signal names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tb/tb_axi_buf_dma.sv')
          text = path.read_text()
          text = text.replace('m_axi_awvalid', 'awvalid')
          text = text.replace('m_axi_awlen', 'awlen')
          text = text.replace('m_axi_arvalid', 'arvalid')
          text = text.replace('m_axi_arlen', 'arlen')
          path.write_text(text)
          PY
          grep -n "SINGLE_LENGTH violation" tb/tb_axi_buf_dma.sv
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tb/tb_axi_buf_dma.sv
          git commit -m "test: check single-beat AXI length"
          git push origin HEAD:agent/single-length
