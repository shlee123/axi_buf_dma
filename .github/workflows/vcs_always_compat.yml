name: VCS Always Compatibility

on:
  push:
    branches: [agent/vcs-always-compat]

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vcs-always-compat
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace always_ff with always
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('rtl').rglob('*'):
              if path.suffix not in {'.sv', '.v'}:
                  continue
              text = path.read_text()
              new = text.replace('always_ff @', 'always @')
              if new != text:
                  path.write_text(new)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No always_ff blocks found under rtl/')
          print('\n'.join(changed))
          PY
          if grep -RIn --include='*.sv' --include='*.v' 'always_ff' rtl; then
            echo 'always_ff remains under rtl/'
            exit 1
          fi
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtl
          git commit -m "rtl: use Verilog always for sequential blocks"
          git push origin HEAD:agent/vcs-always-compat
