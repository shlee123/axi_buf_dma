name: Apply AXI Data Width Parameterization

on:
  push:
    branches:
      - agent/parameterize-data-width

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/parameterize-data-width
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parameterize AXI width-dependent logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rtl = Path('rtl/axi_buf_dma.sv')
          text = rtl.read_text()

          replacements = {
              '  localparam int unsigned AXI_BYTES = AXI_DATA_WIDTH/8;':
              '  localparam int unsigned AXI_BYTES = AXI_DATA_WIDTH/8;\n  localparam int unsigned AXI_ADDR_LSB = $clog2(AXI_BYTES);',
              '  logic [3:0] lane_start, bytes_this_beat, w_load_count;':
              '  logic [8:0] lane_start, bytes_this_beat, w_load_count;',
              '  logic [3:0] r_lane_start, r_payload_count, r_payload_index;':
              '  logic [8:0] r_lane_start, r_payload_count, r_payload_index;',
              '      max_payload = AXI_MAX_BURST_LEN * AXI_BYTES - addr[2:0];':
              '      max_payload = AXI_MAX_BURST_LEN * AXI_BYTES - addr[AXI_ADDR_LSB-1:0];',
              '      single_beat_bytes = AXI_BYTES - addr[2:0];':
              '      single_beat_bytes = AXI_BYTES - addr[AXI_ADDR_LSB-1:0];',
              '      beats = (addr[2:0] + selected_bytes + AXI_BYTES - 1) / AXI_BYTES;':
              '      beats = (addr[AXI_ADDR_LSB-1:0] + selected_bytes + AXI_BYTES - 1) / AXI_BYTES;',
              "    lane_start = (beat_index == 0) ? {1'b0, current_addr[2:0]} : 4'd0;":
              "    lane_start = (beat_index == 0) ? current_addr[AXI_ADDR_LSB-1:0] : '0;",
              '      bytes_this_beat = remaining_bytes[3:0];':
              '      bytes_this_beat = remaining_bytes;',
              "    m_axi_awaddr  = {current_addr[AXI_ADDR_WIDTH-1:3], 3'b000};":
              '    m_axi_awaddr  = (current_addr >> AXI_ADDR_LSB) << AXI_ADDR_LSB;',
              "    m_axi_awsize  = 3'b011;":
              '    m_axi_awsize  = AXI_ADDR_LSB;',
              "    m_axi_araddr  = {current_addr[AXI_ADDR_WIDTH-1:3], 3'b000};":
              '    m_axi_araddr  = (current_addr >> AXI_ADDR_LSB) << AXI_ADDR_LSB;',
              "    m_axi_arsize  = 3'b011;":
              '    m_axi_arsize  = AXI_ADDR_LSB;',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing RTL pattern: {old}')
              text = text.replace(old, new, 1)

          rtl.write_text(text)

          workflow = Path('.github/workflows/synthesis-check.yml')
          text = workflow.read_text()
          old = '''          iverilog -g2012 -Wall -s axi_buf_dma -t null \\
            rtl/dma_pkg.sv \\
            rtl/axi_buf_dma_buffer.sv \\
            rtl/axi_buf_dma.sv'''
          new = '''          for width in 32 64 128; do
            iverilog -g2012 -Wall -s axi_buf_dma -t null \\
              -Paxi_buf_dma.AXI_DATA_WIDTH=$width \\
              rtl/dma_pkg.sv \\
              rtl/axi_buf_dma_buffer.sv \\
              rtl/axi_buf_dma.sv
          done'''
          if old not in text:
              raise SystemExit('synthesis elaboration block not found')
          workflow.write_text(text.replace(old, new, 1))
          PY
          grep -n "AXI_ADDR_LSB\|lane_start\|m_axi_awaddr\|m_axi_awsize\|m_axi_araddr\|m_axi_arsize" rtl/axi_buf_dma.sv
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtl/axi_buf_dma.sv .github/workflows/synthesis-check.yml
          git commit -m "rtl: parameterize AXI data width dependent logic"
          git push origin HEAD:agent/parameterize-data-width
