name: Single Length Test Fix

on:
  push:
    branches:
      - agent/single-length

permissions:
  contents: write

jobs:
  fix-multibeat-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve multi-beat byte-addressing test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tb/tb_axi_buf_dma_byte_addressing.sv')
          text = path.read_text()
          old = '  axi_buf_dma dut (.*,'
          new = "  axi_buf_dma #(.SINGLE_LENGTH(1'b0)) dut (.*,"
          if old not in text:
              raise SystemExit('DUT instantiation not found')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -n "SINGLE_LENGTH" tb/tb_axi_buf_dma_byte_addressing.sv
      - name: Commit test configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tb/tb_axi_buf_dma_byte_addressing.sv
          git commit -m "test: retain multi-beat addressing coverage"
          git push origin HEAD:agent/single-length
