name: Apply M6 Integration

on:
  push:
    branches: [agent/m6-data-width-regression]

permissions:
  contents: write

jobs:
  apply-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-data-width-regression
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply model and CI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          mem = Path('tb/axi_memory_model.sv')
          text = mem.read_text()
          old = '  localparam int unsigned DATA_BYTES    = DATA_WIDTH/8;'
          new = old + '\n  localparam int unsigned ADDR_LSB      = $clog2(DATA_BYTES);'
          if 'ADDR_LSB' not in text:
              if old not in text: raise SystemExit('DATA_BYTES marker missing')
              text = text.replace(old, new, 1)
          text = text.replace("        write_addr       <= {s_axi_awaddr[ADDR_WIDTH-1:3], 3'b000};",
                              "        write_addr       <= (s_axi_awaddr >> ADDR_LSB) << ADDR_LSB;")
          text = text.replace("        read_addr          <= {s_axi_araddr[ADDR_WIDTH-1:3], 3'b000};",
                              "        read_addr          <= (s_axi_araddr >> ADDR_LSB) << ADDR_LSB;")
          mem.write_text(text)

          base = subprocess.check_output(['git','show','origin/main:.github/workflows/synthesis-check.yml'], text=True)
          marker = '      - name: SRAM interface contract check\n'
          step = '''      - name: AXI data-width functional regression\n        shell: bash\n        run: |\n          set -euo pipefail\n          mkdir -p build\n          for width in 32 128; do\n            for single in 0 1; do\n              out="build/tb_data_width_${width}_${single}.vvp"\n              iverilog -g2012 -Wall -s tb_axi_buf_dma_data_width \\\n                -Ptb_axi_buf_dma_data_width.AXI_DATA_WIDTH=${width} \\\n                -Ptb_axi_buf_dma_data_width.SINGLE_LENGTH=${single} \\\n                -o "$out" \\\n                rtl/dma_pkg.sv \\\n                rtl/axi_buf_dma_buffer.sv \\\n                rtl/axi_buf_dma.sv \\\n                tb/axi_memory_model.sv \\\n                tb/tb_axi_buf_dma_data_width.sv\n              timeout 60s vvp "$out"\n            done\n          done\n\n'''
          if marker not in base: raise SystemExit('workflow marker missing')
          Path('.github/workflows/synthesis-check.yml').write_text(base.replace(marker, step + marker, 1))
          PY
          rm -f .github/workflows/apply-m6.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tb/axi_memory_model.sv tb/tb_axi_buf_dma_data_width.sv .github/workflows/synthesis-check.yml .github/workflows/apply-m6.yml
          git commit -m "test: add 32-bit and 128-bit AXI functional regression"
          git push origin HEAD:agent/m6-data-width-regression
