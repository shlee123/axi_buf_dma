name: AXI ID PROT Compatibility Fix

on:
  push:
    branches: [ci/axi-id-prot-validation]

permissions:
  contents: write

jobs:
  patch-testbenches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/axi-id-prot-validation
      - name: Add wildcard compatibility signals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = "// AXI ID/PROT wildcard compatibility signals"
          block = f'''\n  {marker}\n  logic [5:0] m_axi_awid, m_axi_bid, m_axi_arid, m_axi_rid;\n  logic [2:0] m_axi_awprot, m_axi_arprot;\n  logic [5:0] s_axi_awid, s_axi_bid, s_axi_arid, s_axi_rid;\n  logic [2:0] s_axi_awprot, s_axi_arprot;\n  assign s_axi_awid = m_axi_awid;\n  assign s_axi_awprot = m_axi_awprot;\n  assign m_axi_bid = s_axi_bid;\n  assign s_axi_arid = m_axi_arid;\n  assign s_axi_arprot = m_axi_arprot;\n  assign m_axi_rid = s_axi_rid;\n'''

          changed = []
          for path in sorted(Path('tb').glob('tb_axi_buf_dma*.sv')):
              text = path.read_text()
              if marker in text or 'axi_buf_dma dut (.*' not in text:
                  continue
              module_end = text.find(';', text.find('module '))
              if module_end < 0:
                  raise RuntimeError(f'cannot find module header in {path}')
              text = text[:module_end + 1] + block + text[module_end + 1:]
              path.write_text(text)
              changed.append(str(path))
          print('patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit compatibility updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No compatibility changes needed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tb
          git commit -m "test: connect AXI ID and PROT in wildcard testbenches"
          git push origin HEAD:ci/axi-id-prot-validation
