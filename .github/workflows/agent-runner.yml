name: Agent Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: Agent task identifier
        required: false
        default: roadmap-next
  repository_dispatch:
    types: [agent-task]
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: agent-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'agent/') &&
       contains(github.event.pull_request.labels.*.name, 'agent-runner'))
    runs-on: [self-hosted, Windows, X64, axi-dma]
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show runner and task context
        shell: pwsh
        env:
          DISPATCH_TASK: ${{ github.event.client_payload.task }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "SHA: $env:GITHUB_SHA"
          Write-Host "Dispatch task: $env:DISPATCH_TASK"
          Write-Host "Manual task: $env:MANUAL_TASK"
          git status --short --branch

      - name: Verify required tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git --version
          python --version
          iverilog -V
          verilator --version

      - name: Run RTL regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command make -ErrorAction SilentlyContinue) {
            make -C sim regression
          } else {
            throw 'GNU make is required on the Windows runner.'
          }

      - name: Run synthesis-oriented checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          verilator --lint-only --Wall --Wno-fatal --top-module axi_buf_dma `
            rtl/dma_pkg.sv rtl/axi_buf_dma_buffer.sv rtl/axi_buf_dma.sv

      - name: Agent execution hook
        if: ${{ vars.AGENT_CODE_COMMAND != '' }}
        shell: pwsh
        env:
          AGENT_TASK: ${{ github.event.client_payload.task || inputs.task || 'roadmap-next' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Executing configured coding-agent command for task: $env:AGENT_TASK"
          Invoke-Expression "${{ vars.AGENT_CODE_COMMAND }}"

      - name: Upload runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runner-${{ github.run_id }}
          path: |
            sim/build/**
            reports/**
          if-no-files-found: ignore
          retention-days: 14
