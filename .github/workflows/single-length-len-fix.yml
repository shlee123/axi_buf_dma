name: Single Length LEN Fix

on:
  push:
    branches:
      - agent/single-length

permissions:
  contents: write

jobs:
  fix-single-length:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize SINGLE_LENGTH behavior and regression configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          rtl = Path('rtl/axi_buf_dma.sv')
          text = rtl.read_text()
          text = text.replace("    m_axi_awlen   = burst_beats - 1'b1;",
                              "    m_axi_awlen   = SINGLE_LENGTH ? 8'd0 : (burst_beats - 1'b1);", 1)
          text = text.replace("    m_axi_arlen   = burst_beats - 1'b1;",
                              "    m_axi_arlen   = SINGLE_LENGTH ? 8'd0 : (burst_beats - 1'b1);", 1)
          rtl.write_text(text)

          for path in sorted(Path('tb').glob('tb_axi_buf_dma_byte_*.sv')):
              text = path.read_text()
              if '.SINGLE_LENGTH(' in text:
                  continue
              plain = re.sub(r'axi_buf_dma\s+dut\s*\(',
                             "axi_buf_dma #(.SINGLE_LENGTH(1'b0)) dut (",
                             text, count=1)
              if plain != text:
                  path.write_text(plain)
                  continue
              parameterized = re.sub(r'axi_buf_dma\s*#\s*\(',
                                     "axi_buf_dma #(\n    .SINGLE_LENGTH(1'b0),",
                                     text, count=1)
              if parameterized == text:
                  raise SystemExit(f'Unable to configure SINGLE_LENGTH in {path}')
              path.write_text(parameterized)
          PY
          grep -n "m_axi_.*len" rtl/axi_buf_dma.sv
          grep -R -n "SINGLE_LENGTH" tb/tb_axi_buf_dma_byte_*.sv
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtl/axi_buf_dma.sv tb/tb_axi_buf_dma_byte_*.sv
          git commit -m "test: separate single and multi-beat coverage"
          git push origin HEAD:agent/single-length
