name: Debug Single Length Smoke

on:
  push:
    branches:
      - agent/single-length-debug

permissions:
  contents: write

jobs:
  debug-smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length-debug
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Icarus
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
      - name: Capture smoke output
        shell: bash
        run: |
          set +e
          mkdir -p build
          iverilog -g2012 -Wall -s tb_axi_buf_dma -o build/tb_axi_buf_dma.vvp \
            rtl/dma_pkg.sv rtl/axi_buf_dma_buffer.sv rtl/axi_buf_dma.sv \
            tb/axi_memory_model.sv tb/tb_axi_buf_dma.sv > ci_single_length_debug.log 2>&1
          compile_rc=$?
          if [ $compile_rc -eq 0 ]; then
            timeout 30s vvp build/tb_axi_buf_dma.vvp >> ci_single_length_debug.log 2>&1
            sim_rc=$?
          else
            sim_rc=0
          fi
          echo "compile_rc=$compile_rc sim_rc=$sim_rc" >> ci_single_length_debug.log
          exit 0
      - name: Commit debug log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci_single_length_debug.log
          git commit -m "ci: capture single-length smoke output"
          git push origin HEAD:agent/single-length-debug
