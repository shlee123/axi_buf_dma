name: RTL Regression

on:
  pull_request:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'sim/**'
      - '.github/workflows/rtl-sim.yml'
  push:
    branches:
      - main
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'sim/**'
      - '.github/workflows/rtl-sim.yml'

jobs:
  iverilog-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Byte-length and unaligned-address regression
        run: make -C sim clean regression
