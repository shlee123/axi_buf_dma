name: Fix Single Length Smoke Ports

on:
  push:
    branches:
      - agent/single-length

permissions:
  contents: write

jobs:
  fix-smoke-ports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore DUT AXI port names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tb/tb_axi_buf_dma.sv')
          text = path.read_text()
          replacements = {
              '.awlen(awlen)': '.m_axi_awlen(awlen)',
              '.awvalid(awvalid)': '.m_axi_awvalid(awvalid)',
              '.arlen(arlen)': '.m_axi_arlen(arlen)',
              '.arvalid(arvalid)': '.m_axi_arvalid(arvalid)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected connection: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          sed -n '35,56p' tb/tb_axi_buf_dma.sv
      - name: Commit port fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tb/tb_axi_buf_dma.sv
          git commit -m "test: restore AXI smoke port names"
          git push origin HEAD:agent/single-length
